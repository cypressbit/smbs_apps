{% load smbs_documents %}{% if buttons %}
<div class="d-flex flex-wrap gap-2 db-buttons{% if center %} justify-content-center{% endif %}">
  {% for button in buttons %}{% with index=forloop.counter0 %}
  <a class="btn btn-db-{{ button.style }}{% if size == 'large' %} btn-lg{% endif %}" href="{{ button.link|link_href }}"{{ button.link|link_target }}>{% if button.icon %}<i class="bi bi-{{ button.icon }} me-1" aria-hidden="true"></i>{% endif %}<span{% db_field field|default:'buttons' index 'label' %}>{{ button.label }}</span></a>
  {% endwith %}{% endfor %}
</div>{% endif %}
