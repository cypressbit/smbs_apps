{% load smbs_documents %}
<div class="row row-cols-1 row-cols-sm-2 row-cols-lg-{{ props.columns }} g-4 db-team">
  {% for member in props.members %}{% media_for member.photo as photo %}
  <div class="col text-center">
    {% if photo %}<img{% img_sources photo '9rem' %} alt="{{ member.photo.alt }}" class="db-avatar mb-3" loading="lazy"{% if member.photo.focal_point %} style="object-position:{{ member.photo|focal_position }}"{% endif %}>
    {% else %}<div class="db-avatar db-placeholder mb-3 mx-auto"><i class="bi bi-person" aria-hidden="true"></i></div>{% endif %}
    <h3 class="h5 mb-1"{% db_field 'members' forloop.counter0 'name' %}>{{ member.name }}</h3>
    {% if member.role %}<div class="opacity-75 mb-2"{% db_field 'members' forloop.counter0 'role' %}>{{ member.role }}</div>{% endif %}
    {% if member.bio %}<p class="small mb-0"{% db_field 'members' forloop.counter0 'bio' %}>{{ member.bio|linebreaksbr }}</p>{% endif %}
  </div>
  {% endfor %}
</div>
