{% load smbs_documents %}
{% if media %}
<figure class="mb-0">
  {% if props.link %}<a href="{{ props.link|link_href }}"{{ props.link|link_target }}>{% endif %}
  {% if props.aspect != 'natural' %}<div class="ratio ratio-{{ props.aspect }}">{% endif %}
  <img src="{{ media.url }}" alt="{{ props.image.alt }}" loading="lazy"
       class="{% if props.rounded %}db-rounded {% endif %}{% if props.aspect != 'natural' %}w-100 h-100 object-fit-cover{% else %}img-fluid{% endif %}"
       {% if props.image.focal_point %}style="object-position: {% widthratio props.image.focal_point.x 1 100 %}% {% widthratio props.image.focal_point.y 1 100 %}%"{% endif %}>
  {% if props.aspect != 'natural' %}</div>{% endif %}
  {% if props.link %}</a>{% endif %}
  {% if props.caption %}<figcaption class="small mt-2 opacity-75"{% db_field 'caption' %}>{{ props.caption }}</figcaption>{% endif %}
  {% media_attribution media %}
</figure>
{% elif editing %}
<div class="ratio ratio-16x9 db-rounded bg-body-secondary d-flex align-items-center justify-content-center"><i class="bi bi-image fs-1 opacity-50 m-auto"></i></div>
{% endif %}
