{% load smbs_documents %}<div class="db-hours">
  {% if props.heading %}<h3 class="h5 mb-3"{% db_field 'heading' %}>{{ props.heading }}</h3>{% endif %}
  <dl class="row mb-0">
    {% for row in props.rows %}<dt class="col-6 fw-normal"{% db_field 'rows' forloop.counter0 'day' %}>{{ row.day }}</dt><dd class="col-6 text-end mb-2"{% db_field 'rows' forloop.counter0 'hours' %}>{{ row.hours }}</dd>{% endfor %}
  </dl>
  {% if props.note %}<p class="small opacity-75 mt-2 mb-0"{% db_field 'note' %}>{{ props.note }}</p>{% endif %}
</div>
