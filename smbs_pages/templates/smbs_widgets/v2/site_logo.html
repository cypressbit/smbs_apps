{% load smbs_documents %}<a href="/" class="db-site-logo db-site-logo-{{ props.height }} text-reset text-decoration-none">
{% if media %}<img{% img_sources media '(min-width: 768px) 320px, 240px' %} alt="{% if not props.show_name %}{{ props.logo.alt|default:props.name }}{% endif %}">{% endif %}
{% if not media or props.show_name %}<span class="db-site-logo-name h5 fw-bold mb-0"{% db_field 'name' %}>{{ props.name }}</span>{% endif %}</a>
