{% load smbs_documents %}
<div class="d-flex flex-wrap gap-2 db-buttons">
  {% for button in props.buttons %}
  <a class="btn btn-db-{{ button.style }}{% if props.size == 'large' %} btn-lg{% elif props.size == 'small' %} btn-sm{% endif %}"
     href="{{ button.link|link_href }}"{{ button.link|link_target }}>{% if button.icon %}<i class="bi bi-{{ button.icon }} me-1" aria-hidden="true"></i>{% endif %}{{ button.label }}</a>
  {% endfor %}
</div>
