[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smbs-apps"
version = "1.3.0"
description = "Reusable Django app library for SMBS projects"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Django>=6.0",
    "django-taggit",
    "django-mptt",
    "bleach",
    "Pillow",
    "django-imagekit",
    "django-versatileimagefield",
    "pyyaml",
    "psycopg2",
    "nh3",          # smbs_pages page documents: rich text sanitizing (imported lazily)
    "requests",     # smbs_pages: SiteSpec media downloads; smbs_oauth
]

[project.optional-dependencies]
managed = ["PyJWT>=2.10", "cryptography"]  # smbs_managed: SSO token verification
shop = ["stripe"]
mailchimp = ["mailchimp3"]

[tool.setuptools.packages.find]
include = ["smbs_apps*"]
